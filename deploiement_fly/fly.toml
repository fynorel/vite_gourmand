# ════════════════════════════════════════════════════════════════════════
# fly.toml — Vite & Gourmand
# Généré pour Fly.io
# ════════════════════════════════════════════════════════════════════════

app = "vite-gourmand"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "prod"
  PHP_FPM_PM_MAX_CHILDREN = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/"
    port = 8080
    timeout = "10s"
    type = "http"
